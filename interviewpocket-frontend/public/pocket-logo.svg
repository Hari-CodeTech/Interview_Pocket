<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#pocketGrad)" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.3))" />
  <!-- Pocket Shape -->
  <path d="M25 35 L75 35 L75 55 C75 70 50 82 50 82 C50 82 25 70 25 55 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <!-- Inner Code Brackets / Lightning Accent -->
  <path d="M38 48 L30 55 L38 62" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M62 48 L70 55 L62 62" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M54 44 L46 66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="24" r="4" fill="#38bdf8" />
</svg>

